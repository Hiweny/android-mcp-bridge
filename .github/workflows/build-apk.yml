name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, generating..."
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (fallback)
        if: failure()
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-bridge-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: app/build/outputs/apk/**/*.apk
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-create release on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          artifacts: app/build/outputs/apk/**/*.apk
          tag: "latest"
          name: "Latest Build"
          body: |
            ## MCP Bridge APK

            自动构建的最新版本 APK。

            ### 安装方法
            1. 下载下方 APK 文件
            2. 在手机上允许"安装未知来源应用"
            3. 点击安装即可

            ### 功能
            - MCP JSON-RPC 2.0 服务器
            - 内置 10+ 工具（时间、设备信息、剪贴板、HTTP请求等）
            - DeepSeek 对话 WebView
            - 深色 Material 3 界面
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
